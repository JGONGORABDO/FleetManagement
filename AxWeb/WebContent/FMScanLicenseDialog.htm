<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>FMScanLicenseDialog</title>
</head>
<body>
    <div id="FMScanLicenseDialog">
        <div data-dyn-role="metaModel: 'Group'" data-dyn-bind="ExtendedStyle: 'titleGroup'">
            <div data-dyn-role="metaModel: 'DataBoundLabel'" data-dyn-bind="Style: 'FormCaption', Value: 'New Reservation'"></div>
        </div>
        <div data-dyn-template="templateId: 'FMFileUploadControl', resourceBundle: 'FMFileUploadControl'"></div>
        <div>
                <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'OK', ActionCommand: $close($save())"></button>
                <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'Cancel', ActionCommand: $close($revert())"></button>
       </div>
    </div>
</body>
</html>
