<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>FMReservationPaymentDialog</title>
</head>
<body>
    <div id="FMReservationPaymentDialog">
        <div data-dyn-role="metaModel: 'Group'" data-dyn-bind="ExtendedStyle: 'titleGroup'">
            <div data-dyn-role="metaModel: 'DataBoundLabel'" data-dyn-bind="Style: 'FormCaption', Value: 'Add payment information'"></div>
        </div>
        <div data-dyn-role="metaModel: 'ComboBox'" data-dyn-bind="Label: 'Payment method', Items: [{'Value':'0', 'Label':'CreditCard'},{'Value':'1', 'Label':'Cash'}]"></div>
        <div data-dyn-role="metaModel: 'CheckBox'" data-dyn-bind="Label: 'Billing address same as home address'"></div>
            <!--<div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Name on card'"></div>-->
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Address 1', Value: $field('AddressLine1', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Address 2', Value: $field('AddressLine2', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'City', Value: $field('City', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'State', Value: $field('State', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Zip/postal code', Value: $field('ZipCode', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Country/region', Value: $field('Country', 'PaymentAddress')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Credit card number', Value: $field('CCN')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Exp. month', Value: $field('ExpirationMonth')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Exp. year', Value: $field('ExpirationYear')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'CVV', Value: $field('CVV')"></div>
        <div>
            <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'OK', ActionCommand: $close($save())"></button>
            <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'Cancel', ActionCommand: $close($revert())"></button>
        </div>

       
    </div>
</body>
</html>
