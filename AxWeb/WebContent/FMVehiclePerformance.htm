<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>FMVehiclePerformance</title>
</head>
<body>
    <!-- Represents a page using a template with placeholders -->
    <div id="FMVehiclePerformance">
        <div data-dyn-role="metaModel: 'Group'" data-dyn-bind="Label: 'PERFORMANCE'">
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Transmission', Value: $field('Transmission'), AllowEdit:false"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Fuel type', Value: $field('FuelType'), AllowEdit:false"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'MPG', Value: $field('MPG'), AllowEdit:false"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Mileage', Value: $field('Mileage'), AllowEdit:false"></div>
        </div>
    </div>
</body>
</html>
