<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>FMNewReservationDialog</title>
</head>
<body>
    <!-- TODO: Reconcile page with none companion version -->
    <div id="FMCompNewReservation" data-dyn-role="metaModel: 'Form'">
        <div data-dyn-role="metaModel: 'Group'" data-dyn-bind="CssClass: 'titleGroup'">
            <div data-dyn-role="metaModel: 'DataBoundLabel'" data-dyn-bind="Style: 'FormCaption', Value: 'New Reservation'"></div>
        </div>
        <div data-dyn-role="metaModel: 'Group'" data-dyn-bind="Label: 'Reservation'">
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Reservation ID', Value: $field('ReservationId')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Pickup date', Value: $field('PickupDate')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Return date', Value: $field('ReturnDate')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Customer ID', Value: $field('CustomerId')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Vehicle ID', Value: $field('VehicleId')"></div>
            <div data-dyn-role="metaModel: 'String'" data-dyn-bind="Label: 'Total', Value: $field('Total')"></div>
            <div>
                <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'Save', ActionCommand: $close($save())"></button>
                <button data-dyn-role="metaModel: 'CommandButton'" data-dyn-bind="Label: 'Cancel', ActionCommand: $close($revert())"></button>
            </div>
        </div>
    </div>
</body>
</html>
